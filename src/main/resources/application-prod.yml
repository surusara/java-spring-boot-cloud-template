# Prod profile overrides
# Activate with: SPRING_PROFILES_ACTIVE=prod (set via K8s ConfigMap)
spring:
  config:
    activate:
      on-profile: prod
  # OIDC bearer-token validation for the Actuator management port (9090).
  # SAMPLE issuer below — replace with your IdP's real issuer, normally injected via the
  # OIDC_ISSUER_URI env var (see k8s-manifest.yaml). Spring fetches the discovery doc + JWKS
  # from this issuer at startup to validate tokens, so it must be reachable in prod.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/payments}

# Actuator: render health detail only for authenticated callers (see ActuatorSecurityConfig)
management:
  endpoint:
    health:
      show-details: when-authorized

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Monitoring: Kubernetes API enabled in prod (pod has ServiceAccount token + RBAC)
app:
  monitoring:
    enabled: true
    k8s-enabled: true
    refresh-interval-ms: 5000
    sse-heartbeat-ms: 5000
    # Namespace resolved from Downward API env var POD_NAMESPACE
    namespace: ${POD_NAMESPACE:financial-streams}
    deployment-name: payments-stream
    pod-label-selector: app=payments-stream
    kafka-consumer-groups:
      - payments-stream-v1
      - payments-exception-v1
    lag-threshold-warning: 100
    lag-threshold-critical: 500
    k8s-api-timeout-ms: 3000
